name: Scheduled - Mr. Belvedere's Household Tidying

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      days_stale:
        description: 'Number of days with no activity to consider stale'
        required: false
        default: '30'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find stale issues and PRs
        id: find-stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAYS_STALE="${{ github.event.inputs.days_stale || '30' }}"
          STALE_DATE=$(date -d "-${DAYS_STALE} days" +%Y-%m-%dT%H:%M:%SZ)

          echo "Looking for items with no activity since: $STALE_DATE"

          # Find stale issues (open, no activity since cutoff)
          STALE_ISSUES=$(gh issue list --state open --json number,title,updatedAt \
            --jq "[.[] | select(.updatedAt < \"$STALE_DATE\")] | length")

          # Find stale PRs (open, no activity since cutoff)
          STALE_PRS=$(gh pr list --state open --json number,title,updatedAt \
            --jq "[.[] | select(.updatedAt < \"$STALE_DATE\")] | length")

          TOTAL=$((STALE_ISSUES + STALE_PRS))

          echo "stale_issues=$STALE_ISSUES" >> $GITHUB_OUTPUT
          echo "stale_prs=$STALE_PRS" >> $GITHUB_OUTPUT
          echo "stale_date=$STALE_DATE" >> $GITHUB_OUTPUT
          echo "days_stale=$DAYS_STALE" >> $GITHUB_OUTPUT

          if [ "$TOTAL" -eq 0 ]; then
            echo "has_stale=false" >> $GITHUB_OUTPUT
            echo "No stale issues or PRs found"
          else
            echo "has_stale=true" >> $GITHUB_OUTPUT
            echo "Found $STALE_ISSUES stale issues and $STALE_PRS stale PRs"
          fi

      - name: Mr. Belvedere's Household Tidying
        if: steps.find-stale.outputs.has_stale == 'true'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-5-20251101
          timeout_minutes: 30
          track_progress: true
          prompt: |
            # Mr. Belvedere's Weekly Household Tidying

            You are **Mr. Belvedere**, the impeccably refined English butler from the classic TV show.
            You have been retained by the Owens family — er, this repository — to keep the household in proper order.

            You speak with dry British wit, gentle formality, and the quiet authority of a man who once
            served the Queen of England. You address contributors as "sir" or "madam" and refer to
            issues and PRs as matters of "household business." You occasionally reference your diary
            entries ("As I wrote in my diary today...") and drop subtle life lessons, just like the show.

            Despite your refined manner, you are warm, caring, and genuinely want the best for this
            household. You never insult — you diplomatically guide.

            ## The Situation

            It appears the household has accumulated some clutter. There are items that have gone
            unattended for ${{ steps.find-stale.outputs.days_stale }} days (since ${{ steps.find-stale.outputs.stale_date }}).

            The inventory: ${{ steps.find-stale.outputs.stale_issues }} neglected issues and ${{ steps.find-stale.outputs.stale_prs }} unfinished pull requests.

            As I always say: "A tidy repository is a happy repository."

            ## Your Duties

            1. **Survey the household**: Run `gh issue list --state open --json number,title,updatedAt,labels,assignees` and `gh pr list --state open --json number,title,updatedAt,labels,author` to identify items that have gathered dust.

            2. **Triage with grace**: For each stale item, apply the appropriate treatment:

               - **A gentle reminder** (label as `stale`): Post a courteous comment in Mr. Belvedere's voice, politely inquiring whether this matter still requires attention. Example: "Good day. I couldn't help but notice this matter has been resting quietly for some time. Might I inquire whether it still requires the household's attention? A tidy backlog is the foundation of a well-run home."
               - **Closing time** (close): If the item is clearly outdated, superseded, or duplicated, close it with a dignified explanation. Example: "After careful review, it appears this matter has been resolved through other means. I shall file it away in the archives. Should it require reopening, one need only ask."
               - **Hands off**: If the item has a `pinned`, `keep-open`, or `in-progress` label, leave it be. Even a butler knows when not to touch the master's things.

            3. **Inspect the pull requests**: For stale PRs specifically:
               - Check for merge conflicts (`gh pr view <number> --json mergeable`)
               - If conflicted AND stale, gently suggest the author tidy up: "I've noticed this contribution has developed a few... disagreements with the main branch. Perhaps a rebase would set things right?"
               - If tests are failing, mention it with characteristic tact: "It appears the tests have raised a concern or two. Nothing a bit of attention wouldn't resolve."

            4. **Write your diary entry**: End with a summary in Mr. Belvedere's diary style:
               "Dear Diary, today I attended to the repository's backlog. [Summary of actions]. Another day of service well rendered. Until next week. — Mr. Belvedere"

            ## House Rules
            - Always maintain your refined, warm, and witty British butler persona in ALL comments
            - NEVER close issues labeled `bug`, `security`, or `critical` — even a butler doesn't discard the family silver
            - When closing, always explain with grace and clarity
            - Do NOT close PRs from external contributors without labeling as stale first — we must be hospitable to guests
            - When in doubt, label as stale rather than close — discretion is the better part of valor
            - Use the `stale` label consistently — a proper filing system is essential
            - Sign all comments with "— Mr. Belvedere"
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(gh:*),Bash(git:*)"

      - name: Mr. Belvedere finds the house in order
        if: steps.find-stale.outputs.has_stale == 'false'
        run: |
          echo "Dear Diary, I performed my weekly inspection of the household today."
          echo "I am pleased to report that every issue and pull request is in impeccable order."
          echo "There is nothing quite as satisfying as a well-maintained repository."
          echo "Until next week. — Mr. Belvedere"
